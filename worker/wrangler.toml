name = "freesurf-transcriber"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "transcribe.freesurf.tools", zone_name = "freesurf.tools", custom_domain = true, enabled = true }
]

[vars]
ENVIRONMENT = "production"

# Secrets to set via `wrangler secret put`:
#   POD_URL   — the consolidated AI pod URL (e.g. https://<pod-id>-8000.proxy.runpod.net)
#   DEEPGRAM_API_KEY - when set, transcription runs on Deepgram Nova-3 (diarize) instead of the pod
